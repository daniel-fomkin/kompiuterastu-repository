<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/contact.css">

    <script src="../JS/burgerMenu.js" defer></script>

    <title>Document</title>
</head>
<body>
    <header>
        <nav>
            <img src="../assets/icons/myteam-logo.svg" alt="myteam Logo">
            <button id="menu-btn"><img src="../assets/icons/menu-button.svg" alt="menu"></button>
        </nav>
        <div class="burger-menu-container hidden" id="menu">
                <div class="burger-menu">
                    <button id="close-btn"><img src="../assets/icons/close-icon.svg"></button>
                    
                    <nav>
                        <ul>
                            <li>
                                <a href="../index.html">home</a>
                            </li>
                            <li>
                                <a href="about.html">about</a>
                            </li>
                        </ul>
                        <button>
                            <a href="contact.html">contact us</a>
                        </button>
                    </nav>
                </div>
            </div>
        </div>
        <section>
            <div>
                <div class="contact-text-container">
                    <h1>Contact</h1>
                    <h2>Ask us about</h2>
                </div>
                <div class="contact-card-container">
                    <div class="contact-card">
                        <img src="../assets/icons/Group 11.svg">
                        <p>The quality of our talent network</p>
                    </div>

                    <div class="contact-card">
                        <img src="../assets/icons/Group 12.svg">
                        <p>Usage & implementation of our software</p>
                    </div>

                    <div class="contact-card">
                        <img src="../assets/icons/Group 13.svg">
                        <p>How we help drive innovation</p>
                    </div>
                </div>
            </div>
            <form>
                <div class="input-container">
                    <input type="text" placeholder="Name" required>
                </div>
                
                <div class="input-container">
                    <input type="email" placeholder="Email Address" required>
                </div>

                <div class="input-container">
                    <input type="text" placeholder="Company Name" required>
                </div>

                <div class="input-container">
                    <input type="text" placeholder="Title" required>
                </div>
            
                <textarea type="text" placeholder="Message" rows="3"></textarea>

                <button>submit</button>
            </form>
        </section>
    </header>
    <footer></footer>
</body>
</html>
