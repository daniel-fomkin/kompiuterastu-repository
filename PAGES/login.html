<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Myteam - Admin Panel - Login</title>

    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/dashboard-header.css">
    <link rel="stylesheet" href="../CSS/login.css">

    <script src="../JS/login.js" defer></script>
</head>

<body>
    <header>
        <nav>
            <div class="left-navbar-container">
                <div class="logo">
                    <img src="../assets/icons/myteam-logo.svg" alt="myteam Logo">
                    <p>Admin Panel</p>
                </div>

                <ul class="not-mobile">
                    <li>
                        <a href="../feedback">Feedbacks</a>
                    </li>
                    <li>
                        <a href="#">Logs</a>
                    </li>
                </ul>
            </div>
            <button class="not-mobile">
                <a href="../../login">login</a>
            </button>
        </nav>
    </header>
    
</head>

<body>
    <main>
        <form>
            <h1>LOGIN</h1>

            <div class="inputs">
                <div class="error hidden"></div>
                <div class="input-container">
                    <input type="text" name="username" placeholder="Username" required>
                </div>

                <div class="input-container">
                    <input type="text" name="password" placeholder="Password" required>
                </div>
            </div>

            <button type="submit">login</button>
        </form>
    </main>
</body>

</html>
